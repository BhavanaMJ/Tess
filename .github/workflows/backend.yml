name: Backend CI

on:
  push:
    branches: [ main, staging, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, staging, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  backend-test:
    name: Backend Lint, Migrations & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level exit-zero
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Validate Migration Ordering
        run: |
          python3 -c '
          import os, glob
          migrations = sorted(glob.glob("migrations/*.sql"))
          print(f"Found {len(migrations)} migrations:")
          for m in migrations:
              print(f" - {m}")
          assert len(migrations) > 0, "No migrations found!"
          '

      - name: Run Pytest
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          BACKEND_URL: "http://localhost:8000"
        run: |
          pytest -v tests/
